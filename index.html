<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nearby Eats</title>
  <meta name="theme-color" content="#1f6f5c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root {
      --bg: #f6f4ef; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
      --accent: #1f6f5c; --accent-text: #ffffff; --error: #b3261e; --border: #e2dfd7;
      --chip: #ece9e1; --star: #8a5a00; --star-bg: #fbefd5; --fav: #1f6f5c; --fav-bg: #dcefe7;
      --warn: #8a4b00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151714; --card: #1f221e; --text: #ecebe6; --muted: #a3a39c;
        --accent: #4fb89c; --accent-text: #0e1a16; --error: #f2b8b5; --border: #33372f;
        --chip: #2c302a; --star: #f3c96b; --star-bg: #3a3020; --fav: #7fd3b8; --fav-bg: #1d3a31;
        --warn: #f3c96b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px 32px;
    }
    main { max-width: 560px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: 1.5rem; margin: 8px 0 4px; }
    .sub { color: var(--muted); margin: 0 0 12px; font-size: .9rem; }
    button {
      padding: 12px 16px; font-size: 1rem; font-weight: 600; border: 0; border-radius: 12px;
      background: var(--accent); color: var(--accent-text);
    }
    button.wide { width: 100%; padding: 16px; }
    button:disabled { opacity: .6; }
    button.link { background: none; color: var(--muted); font-weight: 400; text-decoration: underline; padding: 8px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; margin-top: 12px;
    }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input, select {
      width: 100%; padding: 12px; font-size: 1rem; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
    }
    .hint { color: var(--muted); font-size: .85rem; margin: 4px 0 0; }
    .error { color: var(--error); }

    /* Filters */
    #controls { display: grid; gap: 8px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    .toggle {
      padding: 8px 12px; font-size: .9rem; font-weight: 500; border-radius: 999px;
      background: var(--card); color: var(--text); border: 1px solid var(--border);
    }
    .toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .row select { width: auto; padding: 8px 12px; font-size: .9rem; border-radius: 999px; }
    .plan-toggle { text-align: left; border-radius: 12px; padding: 10px 12px; }
    .plan-toggle.planned { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    #plan-form { margin-top: 0; }

    /* Map view */
    #map { height: 58vh; min-height: 320px; margin-top: 8px; border-radius: 12px; border: 1px solid var(--border); z-index: 0; }
    #map-hint.picking { color: var(--accent); font-weight: 600; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }

    /* Place cards: the whole card opens the place in Google Maps (a "stretched" link);
       other links on the card sit above it. */
    .place { position: relative; }
    .place:active { background: var(--chip); }
    .place h2 { font-size: 1.05rem; margin: 0; flex: 1; }
    .place h2 a { color: inherit; text-decoration: none; }
    .place h2 a::after { content: ""; position: absolute; inset: 0; border-radius: 12px; }
    .place .above { position: relative; z-index: 1; }
    .place .top { display: flex; gap: 12px; align-items: baseline; margin-bottom: 4px; }
    .dist { font-weight: 600; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .place p { margin: 4px 0 0; }
    .meta { color: var(--muted); font-size: .9rem; }
    .meta a { color: inherit; }
    .meta b { color: var(--text); font-weight: 600; }
    .hours-warn { color: var(--warn); font-size: .9rem; font-weight: 600; }
    .hours-closed { color: var(--error); font-size: .9rem; font-weight: 600; }
    .deal-on { color: var(--accent); font-size: .9rem; font-weight: 600; }
    .place.dim { opacity: .7; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
    .chip.star { background: var(--star-bg); color: var(--star); }
    .chip.fav { background: var(--fav-bg); color: var(--fav); }
    .chip.warn { background: var(--chip); color: var(--error); }
    #more { margin-top: 12px; width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; }
    footer { color: var(--muted); font-size: .8rem; margin-top: 24px; text-align: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Nearby Eats</h1>
    <button id="refresh" hidden>Refresh</button>
  </header>
  <p class="sub" id="status">Loading…</p>

  <!-- One-time connection to the Google Sheet's script -->
  <form class="card" id="setup" hidden>
    <strong>Connect to your Google Sheet</strong>
    <label for="url">Web app URL</label>
    <input id="url" type="url" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <p class="hint">From Apps Script → Deploy → Manage deployments.</p>
    <label for="key">Key</label>
    <input id="key" required autocomplete="off" spellcheck="false">
    <p class="hint">From running <code>showAppSetup</code> in Apps Script.</p>
    <p class="error" id="setup-error" hidden></p>
    <button class="wide" style="margin-top:16px">Connect</button>
  </form>

  <div id="controls" hidden>
    <!-- Where and when: current location and now by default; or plan ahead. -->
    <button class="toggle plan-toggle" id="plan-toggle" aria-expanded="false">📍 Near me · now</button>
    <form class="card" id="plan-form" hidden>
      <label for="plan-place">Starting from</label>
      <input id="plan-place" placeholder="Capitol Hill, an address… (blank = where I am)" autocomplete="off">
      <label for="plan-when">Being there at</label>
      <input id="plan-when" type="datetime-local">
      <p class="hint">Leave blank for right now.</p>
      <p class="error" id="plan-error" hidden></p>
      <div class="row" style="margin-top:12px; align-items:center">
        <button>Show places</button>
        <button type="button" class="link" id="plan-pick">Pick on map</button>
        <button type="button" class="link" id="plan-reset">Back to here and now</button>
      </div>
    </form>
    <input id="q" type="search" placeholder="Search: sushi, brunch, ballard…" autocomplete="off">
    <div class="row">
      <button class="toggle" data-section="all" aria-pressed="true">All</button>
      <button class="toggle" data-section="try" aria-pressed="false">To try</button>
      <button class="toggle" data-section="recommend" aria-pressed="false">⭐ Loved</button>
    </div>
    <div class="row">
      <button class="toggle" data-flag="open" aria-pressed="false">🕒 Open when we'd arrive</button>
      <select id="max" aria-label="Maximum travel time">
        <option value="0">Any travel time</option>
        <option value="15">Within 15 min</option>
        <option value="20">Within 20 min</option>
        <option value="30">Within 30 min</option>
        <option value="45">Within 45 min</option>
      </select>
    </div>
    <div class="row">
      <button class="toggle" data-flag="fav" aria-pressed="false">💚 Favorites</button>
      <button class="toggle" data-flag="deals" aria-pressed="false">🍹 Deals</button>
      <select id="tag" aria-label="Group"><option value="">All groups</option></select>
    </div>
    <div class="row">
      <button class="toggle" data-view="list" aria-pressed="true">☰ List</button>
      <button class="toggle" data-view="map" aria-pressed="false">🗺 Map</button>
    </div>
  </div>

  <div id="mapwrap" hidden>
    <p class="hint" id="map-hint"></p>
    <div id="map"></div>
    <p class="hint legend">
      <span class="dot" style="background:#e0a100"></span>deal or inKind
      <span class="dot" style="background:#1f6f5c"></span>open
      <span class="dot" style="background:#9a9a94"></span>closed on arrival
      <span class="dot" style="background:#2b6fd6"></span>you
    </p>
    <div id="map-card"></div>
  </div>

  <div class="card error" id="error" hidden></div>
  <div id="list"></div>
  <button id="more" hidden>Show more</button>

  <footer>
    v0.16<span id="reconnect" hidden> · <button class="link">Change Sheet connection</button></span>
  </footer>
</main>

<script src="deals.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const CONFIG_KEY = "nearbyeats.config";
  const FILTERS_KEY = "nearbyeats.filters";
  const TIMES_KEY = "nearbyeats.times";
  const PAGE = 40;                   // cards shown at a time
  const TIMED = 15;                  // nearest places that get real travel times
  const REUSE_METERS = 200;          // reuse travel times if you've moved less than this…
  const REUSE_MS = 10 * 60 * 1000;   // …within this long
  const SHORT_STAY = 60;             // flag if you'd have less than this many minutes before closing
  const SHOW_WALK_UNDER = 25;        // list the walk next to transit when it's shorter than this

  // For testing on a computer: ?at=47.61,-122.33 fakes your location, ?now=2026-10-02T21:30 fakes the clock.
  const params = new URLSearchParams(location.search);
  const realNow = () => (params.get("now") ? new Date(params.get("now")) : new Date());
  // "Now" for everything time-related: the planned time when planning ahead.
  const now = () => (state.plan.when ? new Date(state.plan.when) : realNow());

  const state = {
    places: [],
    here: null,        // { lat, lng, acc } once we know where you are (or the planned start)
    hereError: "",
    plan: { place: null, when: null },  // place: { query, label, lat, lng }; when: ms. null = here / now
    geocoded: {},                       // typed places already looked up this session
    filters: { q: "", section: "all", fav: false, deals: false, tag: "", open: false, max: 0 },
    shown: PAGE,
    times: { origin: null, at: 0, byKey: {} },  // travel times, keyed by place
    timesLoading: false,
    timesError: "",
    view: "list",        // "list" or "map"
    picking: false,      // true while waiting for a tap on the map to set the starting point
    selectedKey: null,   // the place whose pin was tapped
  };

  // ---------- Storage (can throw in private mode, so always guarded) ----------

  function loadJSON(key) {
    try { return JSON.parse(localStorage.getItem(key)) || null; } catch { return null; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }

  // ---------- Talking to the Sheet's script ----------

  async function callScript(cfg, extra = "") {
    let res;
    try {
      res = await fetch(`${cfg.url}?key=${encodeURIComponent(cfg.key)}${extra}`, { cache: "no-store" });
    } catch {
      throw new Error("Couldn't reach Google. Check your connection and try again.");
    }
    let data;
    try { data = await res.json(); } catch {
      // Google returns a sign-in web page instead of JSON when access isn't "Anyone".
      throw new Error("The Sheet's script didn't answer properly. In Apps Script, check the deployment's \"Who has access\" is set to Anyone.");
    }
    if (!data.error) return data;
    const messages = {
      "bad-key": "The key doesn't match. Re-run showAppSetup and copy the key again.",
      "monthly-limit": "This month's free Google allowance for that is used up; it resets next month.",
      "not-found": "Couldn't find that place. Try adding a street, neighborhood, or city.",
    };
    const err = new Error(messages[data.error] || "The Sheet's script had a problem: " + data.error);
    err.code = data.error;
    throw err;
  }

  const LOCATION_ERRORS = {
    1: "Location is blocked, so the list is A–Z. To allow it: tap the icon left of the address bar → Permissions → Location.",
    2: "Couldn't get a location (is Location on?), so the list is A–Z.",
    3: "Location timed out, so the list is A–Z. Tap Refresh to try again.",
  };

  function locate() {
    const planned = state.plan.place;
    if (planned) return Promise.resolve({ lat: planned.lat, lng: planned.lng, acc: 0 });
    const at = params.get("at");
    if (at) {
      const [lat, lng] = at.split(",").map(Number);
      return Promise.resolve({ lat, lng, acc: 0 });
    }
    return new Promise((resolve, reject) => {
      if (!("geolocation" in navigator)) return reject(new Error("This browser doesn't support location."));
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }),
        (err) => reject(new Error(LOCATION_ERRORS[err.code] || err.message)),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
      );
    });
  }

  async function load() {
    const cfg = loadJSON(CONFIG_KEY);
    if (!cfg) return showSetup();
    $("setup").hidden = true;
    $("error").hidden = true;
    $("refresh").hidden = false;
    $("reconnect").hidden = false;
    $("refresh").disabled = true;
    $("status").textContent = "Loading from the Sheet and finding you…";

    // Fetch the list and find your location at the same time.
    const [data, here] = await Promise.allSettled([callScript(cfg), locate()]);
    $("refresh").disabled = false;

    state.here = here.status === "fulfilled" ? here.value : null;
    state.hereError = here.status === "rejected" ? here.reason.message : "";
    state.timesError = "";
    forgetFailedTimes();

    if (data.status === "rejected") {
      $("status").textContent = "";
      $("error").textContent = data.reason.message;
      $("error").hidden = false;
      return;
    }
    state.places = data.value.places;
    state.mapsKey = data.value.mapsKey || "";
    for (const p of state.places) {
      p.dealWindows = Deals.parseDeals(p.deals).windows;
      p.inkind = /\binkind\b/i.test(`${p.deals} ${p.desc}`); // inKind dining credit accepted
    }
    state.shown = PAGE;
    fillTagOptions();
    updatePlanUI();
    $("controls").hidden = false;
    render();
  }

  // ---------- Travel times ----------

  /**
   * Saved times are reused while you stay within 200 m for 10 minutes (or, when
   * planning ahead, for the same start and planned time); otherwise start fresh.
   */
  function timesFor(here) {
    const when = state.plan.when || null;
    const fits = (t) => t && t.origin && miles(t.origin, here) * 1609 < REUSE_METERS &&
      (when ? t.when === when : !t.when && Date.now() - t.at < REUSE_MS);
    if (fits(state.times)) return state.times;
    // One previous set is kept aside, so flipping between a plan and "here and now"
    // doesn't fetch the same times again.
    const aside = state.timesAside;
    state.timesAside = state.times;
    state.times = fits(aside) ? aside : { origin: { lat: here.lat, lng: here.lng }, at: Date.now(), when, byKey: {} };
    return state.times;
  }

  function forgetFailedTimes() {
    for (const [k, v] of Object.entries(state.times.byKey)) if (v.failed) delete state.times.byKey[k];
  }

  let timesTimer = null;
  /** Asks the Sheet's script for walking + transit times to the nearest places that don't have them yet. */
  function requestTimes(nearest) {
    clearTimeout(timesTimer);
    timesTimer = setTimeout(() => fetchTimes(nearest), 600); // wait for typing to settle
  }

  async function fetchTimes(nearest) {
    const cfg = loadJSON(CONFIG_KEY);
    if (!cfg || !state.here || state.timesLoading || state.timesError) return;
    const times = timesFor(state.here);
    const need = nearest.filter((x) => !times.byKey[x.p.key]);
    if (!need.length) return;

    state.timesLoading = true;
    updateStatus();
    const ll = (pt) => `${pt.lat.toFixed(5)},${pt.lng.toFixed(5)}`;
    try {
      const data = await callScript(cfg,
        `&action=times&from=${ll(times.origin)}&to=${need.map((x) => ll(x.near.loc)).join("|")}` +
        (times.when ? `&when=${times.when}` : ""));
      need.forEach((x, i) => { times.byKey[x.p.key] = { walk: data.walk[i], transit: data.transit[i] }; });
      saveJSON(TIMES_KEY, state.times);
    } catch (err) {
      state.timesError = err.message;
      need.forEach((x) => { times.byKey[x.p.key] = { failed: true }; }); // don't retry until Refresh
    } finally {
      state.timesLoading = false;
      render();
    }
  }

  /**
   * The trip, transit first: { min, mode, walk, transit, fastest } or null.
   * `min`/`mode` (transit, or walking if there's no transit route) drive sorting
   * and arrival time; `fastest` is used only by the "Within N min" filter.
   */
  function trip(t) {
    if (!t || t.failed) return null;
    // For short hops Google's "transit" route is often just the walk; only count
    // transit when it's at least 2 minutes faster, so the walk isn't shown twice.
    const transit = t.transit != null && (t.walk == null || t.transit < t.walk - 1) ? t.transit : null;
    const min = transit ?? t.walk;
    if (min == null) return null;
    const options = [t.walk, transit].filter((m) => m != null);
    return { min, mode: transit != null ? "transit" : "walk", walk: t.walk, transit, fastest: Math.min(...options) };
  }

  // ---------- Opening hours ----------
  // Hours come from Google as [openDay, HHMM, closeDay, HHMM] with 0 = Sunday,
  // in the restaurant's local time (assumed to match the phone's).

  const WEEK = 7 * 1440;
  const toMin = (hhmm) => Math.floor(hhmm / 100) * 60 + (hhmm % 100);

  /** At time `when`: { open, closesIn } or { open: false, opensIn } (minutes), or null if hours unknown. */
  function openInfo(hours, when) {
    if (!hours || !hours.length) return null;
    const t = when.getDay() * 1440 + when.getHours() * 60 + when.getMinutes();
    let opensIn = Infinity;
    for (const h of hours) {
      if (h.length < 4) return { open: true, closesIn: Infinity }; // open 24/7 (no closing time)
      const start = h[0] * 1440 + toMin(h[1]);
      let end = h[2] * 1440 + toMin(h[3]);
      if (end <= start) end += WEEK; // e.g. Saturday 6 PM → Sunday 1 AM
      for (const tt of [t, t + WEEK]) {
        if (tt >= start && tt < end) return { open: true, closesIn: end - tt };
      }
      opensIn = Math.min(opensIn, (start - t + WEEK) % WEEK);
    }
    return { open: false, opensIn };
  }

  function clock(date, withDay = false) {
    const time = date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return withDay ? `${date.toLocaleDateString([], { weekday: "short" })} ${time}` : time;
  }

  function duration(min) {
    return min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, "0")} min`;
  }

  // ---------- Distance ----------

  /** Straight-line distance in miles (haversine). */
  function miles(a, b) {
    const R = 3958.8, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  /** For chains, the closest open location wins. */
  function nearest(p, here) {
    let found = null;
    for (const loc of p.locs || []) {
      const d = miles(here, loc);
      if (!found || d < found.d) found = { d, loc };
    }
    return found;
  }

  function formatMiles(d) {
    return d < 0.1 ? "< 0.1 mi" : d < 10 ? d.toFixed(1) + " mi" : Math.round(d) + " mi";
  }

  // ---------- Filtering and rendering ----------

  function matches(p, f) {
    if (p.closed === "closed permanently") return false;
    if (f.section !== "all" && p.section !== f.section) return false;
    if (f.fav && !p.fav) return false;
    if (f.deals && !p.deals) return false;
    if (f.tag && !p.tags.includes(f.tag)) return false;
    if (f.q) {
      const hay = [p.name, p.desc, p.cuisine, p.hood, p.deals, ...p.tags].join(" ").toLowerCase();
      if (!f.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  }

  function render() {
    const f = state.filters;
    const here = state.here;
    const t0 = now();

    // 1. Everything that passes the basic filters, nearest first.
    const rows = state.places.filter((p) => matches(p, f)).map((p) => ({ p, near: here ? nearest(p, here) : null }));
    rows.sort((a, b) => (a.near ? a.near.d : Infinity) - (b.near ? b.near.d : Infinity) || a.p.name.localeCompare(b.p.name));

    // 2. The nearest few get real travel times (fetched in the background if missing).
    //    timesFor() first drops saved times if you've moved or they're old.
    const toTime = rows.filter((x) => x.near).slice(0, TIMED);
    if (here) { timesFor(here); requestTimes(toTime); }
    const timed = new Set(toTime.map((x) => x.p.key));
    state.timedCount = toTime.length;

    // 3. Arrival time and opening hours on arrival.
    for (const x of rows) {
      x.trip = timed.has(x.p.key) ? trip(state.times.byKey[x.p.key]) : null;
      x.arrive = new Date(t0.getTime() + (x.trip ? x.trip.min : 0) * 60000);
      const tempClosed = x.p.closed === "closed temporarily";
      x.hours = x.near && !tempClosed ? openInfo(x.near.loc.hours, x.arrive) : null;
      x.closedOnArrival = tempClosed || (x.hours ? !x.hours.open : false);
      // Happy hour (or a day's special) running when you'd arrive, or starting within 30 min.
      x.deal = !x.closedOnArrival && x.p.dealWindows.length
        ? Deals.dealAt(x.p.dealWindows, x.arrive, x.hours && x.hours.open ? x.hours.closesIn : null)
        : null;
      // inKind places rank like a happy hour whenever they're open when you'd arrive.
      x.boost = Boolean(x.deal) || (x.p.inkind && !x.closedOnArrival);
    }

    // 4. Time-based filters.
    let list = rows;
    if (f.open) list = list.filter((x) => !x.closedOnArrival);
    if (f.max) list = list.filter((x) => x.trip && x.trip.fastest <= f.max);

    // 5. Places with travel times first (shortest transit first), then the rest by distance.
    //    Within each: deals on (or starting soon) when you'd arrive, and inKind places,
    //    jump to the top; places closed when you'd arrive go last.
    list.sort((a, b) =>
      (a.trip ? 0 : 1) - (b.trip ? 0 : 1) ||
      a.closedOnArrival - b.closedOnArrival ||
      (a.boost ? 0 : 1) - (b.boost ? 0 : 1) ||
      (a.trip && b.trip ? a.trip.min - b.trip.min : 0));
    state.lastCount = list.length;
    updateStatus();

    const out = $("list");
    out.replaceChildren();
    if (!list.length) {
      const empty = el("p", "empty", "Nothing matches these filters. ");
      const clear = el("button", "link", "Clear filters");
      clear.addEventListener("click", () => setFilter({ q: "", section: "all", fav: false, deals: false, tag: "", open: false, max: 0 }));
      empty.append(clear);
      out.append(empty);
    }
    // 6. List or map: the same filtered places either way. (The list's cards aren't
    //    built while the map is showing; that work would be wasted.)
    const mapMode = state.view === "map";
    if (!mapMode) for (const x of list.slice(0, state.shown)) out.append(card(x));
    $("more").textContent = `Show more (${list.length - state.shown} left)`;
    out.hidden = mapMode;
    $("more").hidden = mapMode || list.length <= state.shown;
    $("mapwrap").hidden = !mapMode;
    if (mapMode) showMap(list);
  }

  // ---------- Map view (loaded only when first opened) ----------
  // Google's map when the Sheet's script supplies a browser key; otherwise a free
  // OpenStreetMap map (Leaflet). Both show the same pins and behave the same.

  const LEAFLET = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min";
  const PIN = { boost: "#e0a100", open: "#1f6f5c", closed: "#9a9a94", you: "#2b6fd6" };
  const SEATTLE = { lat: 47.6062, lng: -122.3321 };
  // Google's library that merges nearby pins into count bubbles when zoomed out.
  const CLUSTERER = "https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.5.3/dist/index.min.js";
  const CLUSTER_UP_TO_ZOOM = 13; // the map opens at 14, so nearby places show as individual pins
  let map = null, mapLoading = null, mapCenteredOn = null;
  let pinLayer = null;   // Leaflet's pins
  let gPins = new Map(); // Google's pins, by place key: { marker, pin, look }
  let gHere = null;      // Google's "you" pin
  let gCluster = null;   // merges Google's pins into bubbles when zoomed out

  // ?gmaps tries Google's map without a key (it works, with a "development" watermark), for testing.
  const useGoogle = () => !state.mapKeyRejected && (Boolean(state.mapsKey) || params.has("gmaps"));

  function addScript(src) {
    return new Promise((ok, fail) => {
      const js = document.createElement("script");
      js.src = src; js.onload = ok; js.onerror = () => fail(new Error("map library didn't load"));
      document.head.append(js);
    });
  }

  function loadMapLibrary() {
    mapLoading ||= (useGoogle() ? loadGoogle() : loadLeaflet()).catch((err) => { mapLoading = null; throw err; });
    return mapLoading;
  }

  function loadLeaflet() {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = LEAFLET + ".css";
    document.head.append(css);
    return addScript(LEAFLET + ".js");
  }

  function loadGoogle() {
    return new Promise((ok, fail) => {
      window.__mapsReady = ok;
      // Google calls this if it rejects the key (wrong website restriction, API not enabled…).
      window.gm_authFailure = useBackupMap;
      const key = state.mapsKey ? `key=${encodeURIComponent(state.mapsKey)}&` : "";
      addScript(`https://maps.googleapis.com/maps/api/js?${key}v=weekly&loading=async&callback=__mapsReady`).catch(fail);
    }).then(() => addScript(CLUSTERER).catch(() => {})); // clustering is a nicety; carry on without it
  }

  /** Google refused the key: throw away its (blank) map and draw the free one instead. */
  function useBackupMap() {
    state.mapKeyRejected = true;
    state.mapNote = "Google rejected the map key, so this is the backup map. In Google Cloud, check the key's website restriction (https://abhijit340.github.io/*), that Maps JavaScript API is enabled and ticked for the key, and wait a few minutes if the key is new.";
    gPins = new Map();
    gHere = null;
    gCluster = null;
    map = null;
    mapLoading = null;
    mapCenteredOn = null;
    const fresh = el("div");
    fresh.id = "map";
    $("map").replaceWith(fresh);
    render();
  }

  function showMapHint() {
    const hint = $("map-hint");
    hint.classList.toggle("picking", state.picking && !state.mapProblem);
    hint.textContent = state.mapProblem || (state.picking ? "Tap the map where you'll be starting from."
      : "Tap a pin for details. Press and hold the map to start from that spot.") + (state.mapNote ? " " + state.mapNote : "");
  }

  async function showMap(list) {
    showMapHint();
    try { await loadMapLibrary(); } catch {
      state.mapProblem = "Couldn't load the map. Check your connection and switch to Map again.";
      showMapHint();
      state.mapProblem = "";
      return;
    }
    if (state.view !== "map") return; // switched away while loading

    const pins = list.filter((x) => x.near).map((x) => ({
      x, lat: x.near.loc.lat, lng: x.near.loc.lng,
      color: x.closedOnArrival ? PIN.closed : x.boost ? PIN.boost : PIN.open,
      selected: x.p.key === state.selectedKey,
    }));
    const tapPin = (pin) => {
      if (state.picking) return startFrom(pin);
      state.selectedKey = pin.x.p.key;
      render();
    };
    // Re-centre only when the starting point changes, so panning around isn't undone.
    const origin = state.here ? `${state.here.lat.toFixed(4)},${state.here.lng.toFixed(4)}` : "none";
    const recenter = mapCenteredOn !== origin;
    mapCenteredOn = origin;

    try {
      (useGoogle() ? drawGoogle : drawLeaflet)(pins, tapPin, recenter);
    } catch (err) {
      // Say what went wrong instead of leaving an empty box.
      state.mapProblem = `The map hit a problem: ${err.message}`;
      showMapHint();
      return;
    }

    const chosen = list.find((x) => x.p.key === state.selectedKey);
    $("map-card").replaceChildren(...(chosen ? [card(chosen)] : []));
  }

  // A round pin as a small image. Image pins let Google draw all of them on one
  // layer, which stays smooth with hundreds of places (vector symbols don't).
  const pinIcons = {};
  function pinIcon(color, selected, size = 20) {
    const d = selected ? 28 : size;
    const id = `${color}|${d}|${selected}`;
    if (!pinIcons[id]) {
      const stroke = selected ? "#111" : "#fff";
      const w = selected ? 3 : 2;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${d}" height="${d}">` +
        `<circle cx="${d / 2}" cy="${d / 2}" r="${d / 2 - w}" fill="${color}" stroke="${stroke}" stroke-width="${w}"/></svg>`;
      pinIcons[id] = {
        url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(d, d),
        anchor: new google.maps.Point(d / 2, d / 2),
      };
    }
    return pinIcons[id];
  }

  /** A bubble standing for several nearby places: gold if any has a deal on (or is inKind). */
  function clusterBubble({ count, position, markers }) {
    const d = count < 10 ? 30 : count < 100 ? 36 : 42;
    const color = markers.some((m) => m.hasDeal) ? PIN.boost : "#14493d";
    return new google.maps.Marker({
      position,
      icon: pinIcon(color, false, d),
      label: { text: String(count), color: "#fff", fontSize: "12px", fontWeight: "700" },
      zIndex: 500 + count,
    });
  }

  function drawGoogle(pins, tapPin, recenter) {
    const G = google.maps;
    const at = (pt) => ({ lat: pt.lat, lng: pt.lng }); // Google wants only these two fields
    if (!map) {
      map = new G.Map($("map"), {
        center: SEATTLE, zoom: 12,
        mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
        clickableIcons: false,     // Google's own place icons would steal taps meant for the map
        gestureHandling: "greedy", // one finger moves the map
      });
      const spot = (e) => ({ lat: e.latLng.lat(), lng: e.latLng.lng() });
      map.addListener("click", (e) => { if (state.picking) startFrom(spot(e)); });
      map.addListener("contextmenu", (e) => startFrom(spot(e))); // press and hold
      if (window.markerClusterer) {
        gCluster = new markerClusterer.MarkerClusterer({
          map,
          algorithm: new markerClusterer.SuperClusterAlgorithm({ maxZoom: CLUSTER_UP_TO_ZOOM, radius: 70 }),
          renderer: { render: clusterBubble },
        });
      }
    }
    // With clustering the library decides which pins are on the map; without it, all are.
    const show = (marker) => (gCluster ? gCluster.addMarker(marker, true) : marker.setMap(map));
    const hide = (marker) => (gCluster ? gCluster.removeMarker(marker, true) : marker.setMap(null));

    // Reuse pins between redraws: only add new places, restyle changed ones, and
    // remove ones that were filtered out. A pin tap then touches two pins, not all of them.
    const seen = new Set();
    for (const pin of pins) {
      const key = pin.x.p.key;
      const look = `${pin.lat},${pin.lng},${pin.color},${pin.selected}`;
      seen.add(key);
      let entry = gPins.get(key);
      if (!entry) {
        entry = { marker: new G.Marker({ optimized: true }), look: "" };
        entry.marker.addListener("click", () => tapPin(entry.pin));
        gPins.set(key, entry);
        show(entry.marker);
      }
      entry.pin = pin; // the click handler always sees the latest details
      if (entry.look !== look) {
        entry.look = look;
        entry.marker.setOptions({ position: at(pin), icon: pinIcon(pin.color, pin.selected), zIndex: pin.selected ? 1000 : 1 });
        entry.marker.hasDeal = pin.color === PIN.boost; // lets a bubble show there's a deal inside
      }
    }
    for (const [key, entry] of gPins) {
      if (!seen.has(key)) { hide(entry.marker); gPins.delete(key); }
    }
    if (gCluster) gCluster.render();

    if (state.here) {
      gHere ||= new G.Marker({ map, clickable: false, zIndex: 999, icon: pinIcon(PIN.you, false, 22) });
      gHere.setPosition(at(state.here));
      gHere.setMap(map);
    } else if (gHere) {
      gHere.setMap(null);
    }

    if (!recenter) return;
    if (state.here) { map.setCenter(at(state.here)); map.setZoom(14); }
    else if (pins.length) {
      const box = new G.LatLngBounds();
      pins.forEach((pin) => box.extend(at(pin)));
      map.fitBounds(box, 24);
    }
  }

  function drawLeaflet(pins, tapPin, recenter) {
    if (!map) {
      map = L.map("map", { preferCanvas: true });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(map);
      pinLayer = L.layerGroup().addTo(map);
      map.on("click", (e) => { if (state.picking) startFrom(e.latlng); });
      map.on("contextmenu", (e) => startFrom(e.latlng)); // press and hold
    }
    map.invalidateSize(); // the map was hidden, so it needs to re-measure itself
    pinLayer.clearLayers();
    for (const pin of pins) {
      L.circleMarker([pin.lat, pin.lng], {
        radius: pin.selected ? 11 : 8, weight: pin.selected ? 3 : 2, color: pin.selected ? "#111" : "#fff",
        fillOpacity: 0.95, fillColor: pin.color,
      }).on("click", (e) => { L.DomEvent.stopPropagation(e); tapPin(pin); }).addTo(pinLayer);
    }
    if (state.here) {
      L.circleMarker([state.here.lat, state.here.lng],
        { radius: 9, weight: 3, color: "#fff", fillColor: PIN.you, fillOpacity: 1, interactive: false }).addTo(pinLayer);
    }
    if (!recenter) return;
    if (state.here) map.setView([state.here.lat, state.here.lng], 14);
    else if (pins.length) map.fitBounds(pins.map((pin) => [pin.lat, pin.lng]), { padding: [24, 24] });
  }

  /** A spot picked on the map becomes the plan's starting point (the planned time is kept). */
  function startFrom(latlng) {
    state.picking = false;
    state.plan = { ...state.plan, place: { query: "", label: "Dropped pin", lat: latlng.lat, lng: latlng.lng, pinned: true } };
    relocate();
  }

  function setView(view) {
    state.view = view;
    if (view !== "map") state.picking = false;
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === view));
    render();
  }

  function updateStatus() {
    const here = state.here;
    const closedCount = state.places.filter((p) => p.closed === "closed permanently").length;
    let where = "A–Z";
    if (here) {
      where = state.timesLoading ? "getting walking & transit times…"
        : state.timesError ? "sorted by distance"
        : `travel times for the nearest ${state.timedCount ?? TIMED}`;
      if (here.acc > 100) where += ` (location ±${Math.round(here.acc)} m)`;
    }
    $("status").textContent = `${state.lastCount ?? 0} places · ${where}` + (closedCount ? ` · ${closedCount} closed hidden` : "");
    const problem = state.hereError || state.timesError;
    $("error").textContent = problem;
    $("error").hidden = !problem;
  }

  function card({ p, near, trip, hours, arrive, deal }) {
    const c = el("article", "card place" + ((hours && !hours.open) || p.closed === "closed temporarily" ? " dim" : ""));
    const top = el("div", "top");
    const h2 = el("h2");
    h2.append(link(mapsUrl(p, near), p.name));
    top.append(h2);
    if (trip) top.append(el("span", "dist", `${trip.min} min ${trip.mode === "walk" ? "🚶" : "🚌"}`));
    else if (near) top.append(el("span", "dist", formatMiles(near.d)));
    c.append(top);

    if (p.desc || p.cuisine) c.append(el("p", "", p.desc || p.cuisine));

    // Travel: transit first, plus the walk when it's short enough to be a real option
    // ("🚌 17 min or 🚶 20 min walk").
    if (trip) {
      const line = el("p", "meta");
      if (trip.transit != null) line.append(el("b", "", `🚌 ${trip.transit} min`));
      if (trip.walk != null && (trip.walk < SHOW_WALK_UNDER || trip.transit == null)) {
        if (trip.transit != null) line.append(" or ");
        line.append(el(trip.transit == null ? "b" : "span", "", `🚶 ${trip.walk} min walk`));
      }
      line.append(` · arrive ~${clock(arrive)}`);
      c.append(line);
    }

    // Hours on arrival (or now, for places without a travel time).
    if (hours) c.append(hoursLine(hours, arrive, Boolean(trip)));
    if (deal) c.append(dealLine(deal, arrive, Boolean(trip)));

    // Neighborhood, chain size, and the menu link (which sits above the card-wide Maps link).
    const where = el("p", "meta", "📍 " + (p.hood || (near ? near.loc.addr : "") || "No location yet"));
    if (p.locs && p.locs.length > 1) where.append(` · nearest of ${p.locs.length}`);
    if (p.menu) where.append(" · ", link(p.menu, "🍽 Menu", "above"));
    c.append(where);

    if (p.deals) c.append(el("p", "meta", "🍹 " + p.deals));

    const chips = el("div", "chips");
    if (p.section === "recommend") chips.append(el("span", "chip star", "⭐ Been & loved"));
    if (p.fav) chips.append(el("span", "chip fav", "💚 Favorite"));
    if (p.inkind) chips.append(el("span", "chip fav", "💳 inKind"));
    if (p.closed === "closed temporarily") chips.append(el("span", "chip warn", "⏸ Temporarily closed (Google)"));
    for (const tag of p.tags) chips.append(el("span", "chip", tag));
    if (chips.children.length) c.append(chips);
    return c;
  }

  /**
   * With a travel time:    "🕒 Open till 11:30 PM · you'd have 2 h 46 min"
   *                        "⚠️ Closes 9:00 PM · you'd have only 28 min"   (under SHORT_STAY)
   * Without (arrival=now): "🕒 Open till 11:30 PM" / "⚠️ Closes 9:00 PM · in 28 min"
   * Closed:                "🔴 Closed when you'd arrive · opens Sat 11:00 AM"
   */
  function hoursLine(h, arrive, isArrival) {
    if (h.open && h.closesIn === Infinity) return el("p", "meta", "🕒 Open 24 hours");
    if (h.open) {
      const closes = clock(new Date(arrive.getTime() + h.closesIn * 60000));
      const left = duration(h.closesIn);
      if (h.closesIn < SHORT_STAY) {
        return el("p", "hours-warn", `⚠️ Closes ${closes} · ${isArrival ? `you'd have only ${left}` : state.plan.when ? `${left} later` : `in ${left}`}`);
      }
      return el("p", "meta", `🕒 Open till ${closes}` + (isArrival ? ` · you'd have ${left}` : ""));
    }
    const opens = new Date(arrive.getTime() + h.opensIn * 60000);
    const otherDay = opens.toDateString() !== arrive.toDateString();
    return el("p", "hours-closed", `🔴 Closed ${isArrival ? "when you'd arrive" : state.plan.when ? "then" : "now"} · opens ${clock(opens, otherDay)}`);
  }

  /**
   * "🍹 Happy hour on when you'd arrive · until 6:00 PM"
   * "🍹 Happy hour from 5:00 PM · 10 min after you'd arrive"
   * "🏷 Special today" (the deals line below says what it is)
   */
  function dealLine(d, arrive, isArrival) {
    const at = (min) => clock(new Date(arrive.getTime() + min * 60000));
    if (d.kind === "special") return el("p", "deal-on", state.plan.when ? "🏷 Special that day" : "🏷 Special today");
    if (d.status === "now") {
      return el("p", "deal-on", `🍹 Happy hour ${isArrival ? "on when you'd arrive" : state.plan.when ? "on then" : "now"} · until ${at(d.endsIn)}`);
    }
    return el("p", "deal-on", `🍹 Happy hour from ${at(d.startsIn)} · ${d.startsIn} min ${isArrival ? "after you'd arrive" : state.plan.when ? "later" : "from now"}`);
  }

  /**
   * The place's Google Maps listing (photos, reviews, Directions): the nearest
   * location's page, or a Maps search when Google hasn't located it.
   */
  function mapsUrl(p, near) {
    const loc = near ? near.loc : (p.locs || [])[0];
    if (loc && loc.maps) return loc.maps;
    const q = [p.name, p.hood, "Seattle"].filter(Boolean).join(" ");
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  }

  function link(href, text, className = "") {
    const a = el("a", className, text);
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    return a;
  }

  // Builds an element with text set safely (Sheet text is never treated as HTML).
  function el(tag, className = "", text = "") {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function fillTagOptions() {
    const tags = [...new Set(state.places.flatMap((p) => p.tags))].sort();
    const select = $("tag");
    select.replaceChildren(new Option("All groups", ""), ...tags.map((t) => new Option(t, t)));
    if (!tags.includes(state.filters.tag)) state.filters.tag = "";
    select.value = state.filters.tag;
    select.hidden = !tags.length;
  }

  // ---------- Filter controls ----------

  function applyFilterUI() {
    const f = state.filters;
    $("q").value = f.q;
    $("max").value = String(f.max || 0);
    document.querySelectorAll("[data-section]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.section === f.section));
    document.querySelectorAll("[data-flag]").forEach((b) => b.setAttribute("aria-pressed", Boolean(f[b.dataset.flag])));
  }

  function setFilter(change) {
    Object.assign(state.filters, change);
    state.shown = PAGE;
    saveJSON(FILTERS_KEY, state.filters);
    applyFilterUI();
    render();
  }

  $("q").addEventListener("input", (e) => setFilter({ q: e.target.value.trim() }));
  document.querySelectorAll("[data-section]").forEach((b) =>
    b.addEventListener("click", () => setFilter({ section: b.dataset.section })));
  document.querySelectorAll("[data-flag]").forEach((b) =>
    b.addEventListener("click", () => setFilter({ [b.dataset.flag]: !state.filters[b.dataset.flag] })));
  $("tag").addEventListener("change", (e) => setFilter({ tag: e.target.value }));
  $("max").addEventListener("change", (e) => setFilter({ max: Number(e.target.value) }));
  $("more").addEventListener("click", () => { state.shown += PAGE; render(); });

  // ---------- Setup ----------

  function showSetup() {
    const cfg = loadJSON(CONFIG_KEY);
    $("url").value = cfg?.url || "";
    $("key").value = cfg?.key || "";
    $("setup").hidden = false;
    $("controls").hidden = true;
    $("refresh").hidden = true;
    $("reconnect").hidden = true;
    $("error").hidden = true;
    $("more").hidden = true;
    $("mapwrap").hidden = true;
    $("list").replaceChildren();
    $("status").textContent = "One-time setup";
  }

  $("setup").addEventListener("submit", async (e) => {
    e.preventDefault();
    const cfg = { url: $("url").value.trim(), key: $("key").value.trim() };
    const btn = e.submitter;
    btn.disabled = true;
    $("setup-error").hidden = true;
    try {
      await callScript(cfg); // test the connection before saving it
      saveJSON(CONFIG_KEY, cfg);
      load();
    } catch (err) {
      $("setup-error").textContent = err.message;
      $("setup-error").hidden = false;
    } finally {
      btn.disabled = false;
    }
  });

  // ---------- Planning ahead: a different start and/or time ----------

  function updatePlanUI() {
    const { place, when } = state.plan;
    const where = place ? place.label.split(",").slice(0, 2).join(",") : "Near me";
    const btn = $("plan-toggle");
    btn.textContent = `📍 ${where} · ${when ? clock(new Date(when), true) : "now"}`;
    btn.classList.toggle("planned", Boolean(place || when));
  }

  // "2026-10-03T19:00" in the phone's own time zone, as the date-time picker wants it.
  function toLocalInput(d) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function showPlanForm(open) {
    $("plan-form").hidden = !open;
    $("plan-toggle").setAttribute("aria-expanded", String(open));
    if (!open) return;
    $("plan-error").hidden = true;
    const place = state.plan.place;
    $("plan-place").value = place ? place.query : "";
    $("plan-place").placeholder = place && place.pinned
      ? "Dropped pin (type a place to change it)"
      : "Capitol Hill, an address… (blank = where I am)";
    $("plan-when").value = state.plan.when ? toLocalInput(new Date(state.plan.when)) : "";
    $("plan-when").min = toLocalInput(realNow());
  }

  /** Re-sorts for the current plan (or here and now) without reloading the Sheet. */
  async function relocate() {
    updatePlanUI();
    state.timesError = "";
    forgetFailedTimes();
    try {
      state.here = await locate();
      state.hereError = "";
    } catch (err) {
      state.here = null;
      state.hereError = err.message;
    }
    state.shown = PAGE;
    render();
  }

  $("plan-toggle").addEventListener("click", () => showPlanForm($("plan-form").hidden));

  $("plan-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = $("plan-place").value.trim();
    let when = $("plan-when").value ? new Date($("plan-when").value).getTime() : null;
    if (when && when <= realNow().getTime()) when = null; // a past time just means "now"
    const btn = e.submitter || e.target.querySelector("button");
    btn.disabled = true;
    $("plan-error").hidden = true;
    try {
      // A blank box keeps a pin dropped on the map; otherwise blank means "where I am".
      let place = state.plan.place && state.plan.place.pinned ? state.plan.place : null;
      if (query) {
        // Each typed place is looked up once per session.
        const known = state.geocoded[query.toLowerCase()];
        place = known || { query, ...(await callScript(loadJSON(CONFIG_KEY), `&action=geocode&q=${encodeURIComponent(query)}`)) };
        state.geocoded[query.toLowerCase()] = place;
      }
      state.plan = { place, when };
      showPlanForm(false);
      await relocate();
    } catch (err) {
      $("plan-error").textContent = err.message;
      $("plan-error").hidden = false;
    } finally {
      btn.disabled = false;
    }
  });

  $("plan-reset").addEventListener("click", () => {
    state.plan = { place: null, when: null };
    showPlanForm(false);
    relocate();
  });

  // "Pick on map": switch to the map and wait for one tap.
  $("plan-pick").addEventListener("click", () => {
    showPlanForm(false);
    state.picking = true;
    setView("map");
    $("mapwrap").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  document.querySelectorAll("[data-view]").forEach((b) =>
    b.addEventListener("click", () => setView(b.dataset.view)));

  $("refresh").addEventListener("click", load);
  $("reconnect").addEventListener("click", showSetup);

  Object.assign(state.filters, loadJSON(FILTERS_KEY) || {});
  Object.assign(state.times, loadJSON(TIMES_KEY) || {});
  applyFilterUI();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  load();
</script>
</body>
</html>
