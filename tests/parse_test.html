<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>parseSheet test</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
    .pass { color: #1a7f37; } .fail { color: #cf222e; font-weight: 600; }
    pre { background: #f5f5f5; padding: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
<h1>parseSheet test</h1>
<p>Checks the rules in <code>apps-script/Code.gs</code> against made-up rows below. If
<code>tests/fixture.json</code> exists (made by <code>tools/export_fixture.py</code>, never committed),
it also shows summary counts for the real list.</p>
<ul id="checks"></ul>
<h2>Real list summary</h2>
<pre id="summary">No fixture.json found.</pre>
<script>
// Made-up rows mirroring the real tab's structure: [name, menu, desc, hood, deals].
const ROWS = [
  // [row values, background, bold, strike, link]
  [['Name', 'menu/website', 'description', 'nieghborhood', 'deals?'], '#ffffff', true],
  [['', '', '', '', ''], '#ffffff'],
  [['would recommend / want to return', '', '', '', ''], '#ffffff', true],
  [['Alpha Diner', '', 'burgers', 'fremont', 'HH 4-5'], '#ffffff'],
  [['Bravo Bistro', 'https://bravo.example/menu', 'french', 'ballard', ''], '#ffffff'],
  [['AVOID', '', '', '', ''], '#ffffff', true],
  [['Charlie Grill', '', 'meh', 'belltown', ''], '#ffffff'],
  [['Delta Deli', '', 'rude', '', ''], '#ffffff'],
  [['To Try', '', '', '', ''], '#ffffff', true],
  [['https://example.com/list', '', 'a reference link', '', ''], '#ffffff'],
  [['Echo Eatery', '', 'noodles', 'u district', ''], '#d9ead3'],
  [['Foxtrot Café', '', '', '', ''], '#ffffff', false, false, 'https://foxtrot.example'],
  [['', '', '', '', ''], '#ffffff'],
  [['Market Hall', '', '', '', ''], '#ffffff', true],
  [['Golf Grocery', '', 'cheese', 'market', ''], '#b6d7a8'],
  [['alpha diner', '', 'burgers again', 'market', ''], '#ffffff'],
  [['Delta Deli ', '', 'duplicate of an AVOID place', 'market', ''], '#ffffff'],
  [['', '', '', '', ''], '#ffffff'],
  [['Hotel Kitchen', '', 'closed?', 'downtown', ''], '#ffffff', false, true],
  [['Big Group - Chef Name', '', '', '', ''], '#ffffff', true],
  [['India Inn', '', 'curry', 'sodo', ''], '#ffffff'],
];
const SYNTHETIC = {
  values: ROWS.map(r => r[0]),
  backgrounds: ROWS.map(r => r[1]),
  bold: ROWS.map(r => Boolean(r[2])),
  strike: ROWS.map(r => Boolean(r[3])),
  links: ROWS.map(r => r[4] || ''),
};

// Stand-in for the one Apps Script service the pure helpers touch.
window.Utilities = { formatDate: (d, tz, fmt) => (fmt === 'yyyy-MM' ? '2026-10' : fmt === 'MMM d' ? 'Oct 1' : '2026-09-30') };

// Made-up Google Text Search results.
const g = (name, lat, status = 'OPERATIONAL', periods = []) => ({
  id: 'id-' + name, displayName: { text: name }, formattedAddress: name + ' St, Seattle',
  location: { latitude: lat, longitude: -122.3 }, primaryTypeDisplayName: { text: 'Restaurant' },
  businessStatus: status, googleMapsUri: 'https://maps.example/' + lat, utcOffsetMinutes: -420,
  regularOpeningHours: { periods },
});

(async () => {
  const code = await (await fetch('../apps-script/Code.gs')).text();
  const { parseSheet, buildQuery_, toRecord_, namesMatch_, overallStatus_, needsLookup_, withAppData_, parseMatrix_, parseLatLng_,
    pickStale_, refreshFromDetails_, refreshFromSearch_, departureTime_, matrixRequest_, parseGeocode_,
    rowsToData_, dataToRows_, applyVisit_, visitOf_, carryVisit_, DATA_HEADERS, parseAdded_, cleanLoc_, safeCell_, healthFrom_, applyEdit_ } =
    new Function(code + '\nreturn { parseSheet, buildQuery_, toRecord_, namesMatch_, overallStatus_, needsLookup_, withAppData_, parseMatrix_, parseLatLng_, pickStale_, refreshFromDetails_, refreshFromSearch_, departureTime_, matrixRequest_, parseGeocode_, rowsToData_, dataToRows_, applyVisit_, visitOf_, carryVisit_, DATA_HEADERS, parseAdded_, cleanLoc_, safeCell_, healthFrom_, applyEdit_ };')();
  const places = parseSheet(SYNTHETIC);
  const find = (k) => places.find(p => p.key === k);

  const checks = [
    ['AVOID places are dropped', !find('charlie grill')],
    ['AVOID wins over a duplicate elsewhere', !find('delta deli')],
    ['URL rows are skipped', places.every(p => !/^https?:/i.test(p.name))],
    ['header rows are not places', !find('to try') && !find('avoid') && !find('market hall') && !find('name')],
    ['duplicate: recommend wins and gains the group tag', find('alpha diner')?.section === 'recommend' && find('alpha diner')?.tags.includes('Market Hall')],
    ['bold name-only row starts a group', find('golf grocery')?.tags[0] === 'Market Hall'],
    ['group name is cut at " - "', find('india inn')?.tags[0] === 'Big Group'],
    ['blank row ends a group', find('hotel kitchen')?.tags.length === 0],
    ['name-only row is kept as a place', find('foxtrot cafe')?.section === 'try'],
    ['accents ignored in keys', Boolean(find('foxtrot cafe'))],
    ['name-cell link used as menu', find('foxtrot cafe')?.menu === 'https://foxtrot.example'],
    ['column B link preferred as menu', find('bravo bistro')?.menu === 'https://bravo.example/menu'],
    ['light green 3 = favorite', find('echo eatery')?.fav === true],
    ['light green 2 = favorite', find('golf grocery')?.fav === true],
    ['white = not favorite', find('bravo bistro')?.fav === false],
    ['strikethrough flagged', find('hotel kitchen')?.struck === true],
    ['expected count (7 places)', places.length === 7],
  ];

  // ----- Google lookup helpers -----
  const P = (name, hood = '') => ({ key: name.toLowerCase(), name, hood, row: 9 });
  const q = (hood) => buildQuery_(P('Alpha Diner', hood));
  const chain = toRecord_(P('Echo Eatery', 'u district, fremont'), 200, JSON.stringify({ places: [
    g('Echo Eatery - U District', 47.66, 'OPERATIONAL', [{ open: { day: 1, hour: 11, minute: 0 }, close: { day: 1, hour: 22, minute: 30 } }]),
    g('Unrelated Pho', 47.65),
    g('Echo Eatery Fremont', 47.65, 'CLOSED_PERMANENTLY'),
  ] }));
  const single = toRecord_(P('Golf Grocery', 'market'), 200, JSON.stringify({ places: [g('Totally Different Pho', 47.6)] }));
  const stored = { status: 'ok', query: 'Alpha Diner capitol hill' };

  checks.push(
    ['query: single neighborhood is added', q('capitol hill').text === 'Alpha Diner capitol hill' && !q('capitol hill').multi],
    ['query: comma list = chain, name only', q('capitol hill, ballard').text === 'Alpha Diner' && q('capitol hill, ballard').multi],
    ['query: "others?" = chain', q('capitol hill, others? ').multi],
    ['query: brackets and ? stripped', q('west seattle (alki)').text === 'Alpha Diner west seattle alki'],
    ['query: no neighborhood = name only', q('').text === 'Alpha Diner'],
    ['match: apostrophes ("joes")', namesMatch_('joes noodle shack', "Joe's Noodle Shack")],
    ['match: shared distinctive word', namesMatch_('Pelican/otter + heron', 'The Otter and the Heron')],
    ['match: generic words alone don\'t match', !namesMatch_('Echo Cafe', 'Delta Cafe')],
    ['match: different name rejected', !namesMatch_('Echo Eatery', 'Totally Different Pho')],
    ['429 = retry later, nothing saved', toRecord_(P('X'), 429, '').status === 'retry'],
    ['HTTP error recorded', toRecord_(P('X'), 500, '').status === 'error 500'],
    ['no results = not found', toRecord_(P('X'), 200, '{}').status === 'not found'],
    ['chain keeps only name matches', chain.status === 'ok' && chain.locs.length === 2],
    ['hours compacted to [day, HHMM, day, HHMM]', JSON.stringify(chain.locs[0].hours) === '[[1,1100,1,2230]]'],
    ['wrong single result flagged "check name"', single.status === 'check name' && single.locs.length === 1],
    ['status: all closed = closed permanently', overallStatus_([{ status: 'CLOSED_PERMANENTLY' }]) === 'closed permanently'],
    ['status: one open location = open', overallStatus_(chain.locs) === 'open'],
    ['lookup needed: new place', needsLookup_(P('Alpha Diner', 'capitol hill'), undefined)],
    ['lookup skipped: unchanged place', !needsLookup_(P('Alpha Diner', 'capitol hill'), stored)],
    ['lookup redone: neighborhood edited', needsLookup_(P('Alpha Diner', 'fremont'), stored)],
    ['lookup redone: previous error', needsLookup_(P('Alpha Diner', 'capitol hill'), { ...stored, status: 'error 500' })],
    ['app gets only open locations', withAppData_([P('Echo Eatery')], new Map([['echo eatery', chain]]))[0].locs.length === 1],
    ['app gets no location for "skip"', withAppData_([P('Echo Eatery')], new Map([['echo eatery', { ...chain, status: 'skip' }]]))[0].locs.length === 0],
    ['match: short name at start ("zu zu")', namesMatch_('zu zu', 'Zu Zu Kitchen Fremont')],
    ['match: punctuation inside ("qaz")', namesMatch_('qaz', "qa'z Seattle")],
    ['no match: prefix mid-word ("mira")', !namesMatch_('mira', 'Miracle Mile Diner')],
    ['match: one typo ("bellatrixa")', namesMatch_('bellatrixa', 'Belatrixa')],
    ['match: one typo, short word ("gnoma")', namesMatch_('gnoma lao', 'Noma Lhao Shop')],
    ['no match: two typos', !namesMatch_('quokka', 'Quacker Bar')],
    ['no match: 3-letter words need exact', !namesMatch_('Pho Ahn', 'Phu Bay')],
    ['app gets hours with each location', JSON.stringify(withAppData_([P('Echo Eatery')], new Map([['echo eatery', chain]]))[0].locs[0].hours) === '[[1,1100,1,2230]]'],
    ['lat,lng parsed', JSON.stringify(parseLatLng_('47.61,-122.33')) === '{"latitude":47.61,"longitude":-122.33}'],
    ['bad lat,lng rejected', parseLatLng_('47.61;-122.33') === null && parseLatLng_('') === null],
    ['matrix: seconds → minutes, in destination order', JSON.stringify(parseMatrix_(200, JSON.stringify([
      { originIndex: 0, destinationIndex: 1, duration: '754s', condition: 'ROUTE_EXISTS' },
      { originIndex: 0, destinationIndex: 0, duration: '120s', condition: 'ROUTE_EXISTS' },
      { originIndex: 0, destinationIndex: 2, condition: 'ROUTE_NOT_FOUND' },
    ]), 3)) === '[2,13,null]'],
    ['matrix: first destination has no index field', parseMatrix_(200, '[{"duration":"60s","condition":"ROUTE_EXISTS"}]', 1)[0] === 1],
    ['matrix: HTTP error → all null', JSON.stringify(parseMatrix_(403, 'denied', 2)) === '[null,null]'],
  );

  // ----- Monthly refresh -----
  const loc1 = chain.locs[0];
  const R = (key, at, status = 'ok', locs = [loc1]) => ({ key, name: key, at, status, locs, query: key });
  const recs = new Map([
    ['a', R('a', '2026-08-01')], ['b', R('b', '2026-09-20')], ['c', R('c', '2026-07-15', 'check name')],
    ['d', R('d', '2026-06-01', 'skip')], ['e', R('e', '2026-06-01', 'not found', [])], ['f', R('f', 'garbage')],
  ]);
  const order = [...'abcdef'].map(k => P(k));
  const due = pickStale_(order, recs, new Date('2026-10-01'), 28, 10).map(r => r.key);
  const fresh = refreshFromDetails_(R('a', '2026-08-01', 'ok'), 200, JSON.stringify(g('Echo Eatery', 47.7)));
  const kept = refreshFromSearch_(R('ch', '2026-08-01', 'ok'), { status: 'check name', locs: [loc1], at: '2026-09-30' });

  checks.push(
    ['refresh: oldest first, unreadable date first', JSON.stringify(due) === '["f","c","a"]'],
    ['refresh: skips skip / not found / recent', !due.includes('d') && !due.includes('e') && !due.includes('b')],
    ['refresh: limit respected', pickStale_(order, recs, new Date('2026-10-01'), 28, 2).length === 2],
    ['refresh: force mode (age 0) includes recent', pickStale_(order, recs, new Date('2026-10-01'), 0, 10).some(r => r.key === 'b')],
    ['details: new data, status kept, date updated', fresh.status === 'ok' && fresh.locs[0].lat === 47.7 && fresh.at === '2026-09-30'],
    ['details: retired ID → error (search again)', refreshFromDetails_(R('a', 'x'), 404, '').status === 'error 404'],
    ['details: other error → unchanged', refreshFromDetails_(R('a', '2026-08-01'), 500, '').at === '2026-08-01'],
    ['chain: your "ok" survives a re-search', kept.status === 'ok'],
    ['chain: failed search keeps old data', refreshFromSearch_(R('ch', '2026-08-01'), { status: 'error 500' }).at === '2026-08-01'],
  );
  // ----- Planning ahead -----
  const clockNow = new Date('2026-10-02T20:30:00Z');
  const inTwoHours = clockNow.getTime() + 2 * 3600000;
  const ll = { latitude: 47.6, longitude: -122.3 };
  const body = (mode, depart) => JSON.parse(matrixRequest_(ll, [ll], mode, 'k', depart).payload);
  const geo = (status, results = []) => parseGeocode_(200, JSON.stringify({ status, results }));
  checks.push(
    ['plan: future time → ISO departure', departureTime_(String(inTwoHours), clockNow) === '2026-10-02T22:30:00.000Z'],
    ['plan: no time / past / garbage → now', departureTime_(undefined, clockNow) === null && departureTime_(clockNow.getTime() - 5000, clockNow) === null && departureTime_('soon', clockNow) === null],
    ['plan: more than 90 days out → now', departureTime_(clockNow.getTime() + 100 * 86400000, clockNow) === null],
    ['plan: departure time sent for transit only', body('TRANSIT', 'X').departureTime === 'X' && !('departureTime' in body('WALK', 'X')) && !('departureTime' in body('TRANSIT', null))],
    ['geocode: first result → lat/lng/label', JSON.stringify(geo('OK', [{ formatted_address: 'Somewhere, Seattle', geometry: { location: { lat: 47.62, lng: -122.32 } } }])) === '{"lat":47.62,"lng":-122.32,"label":"Somewhere, Seattle"}'],
    ['geocode: nothing found', geo('ZERO_RESULTS').error === 'not-found'],
    ['geocode: Google error passed on', geo('REQUEST_DENIED').error === 'geocode REQUEST_DENIED' && parseGeocode_(500, '').error === 'geocode failed (500)'],
  );

  // ----- Mark visited, and the "app data" tab layout -----
  const OLD_HEADER = ['key', 'Your name', 'Sheet row', 'Status', 'Google name', 'Address', 'Locations',
    'Cuisine (Google)', 'Open/closed', 'Searched for', 'Looked up', 'data (JSON)'];
  const oldRow = ['echo eatery', 'Echo Eatery', 9, ' OK ', 'Echo Eatery', '1 St', 1, 'Cafe', 'open', 'Echo Eatery fremont', '2026-09-30', JSON.stringify([loc1])];
  const fromOld = rowsToData_(OLD_HEADER, [oldRow, ['', '', '', '', '', '', '', '', '', '', '', '']]);
  const recOld = fromOld.get('echo eatery');
  const visited = applyVisit_(recOld, { verdict: 'Loved', deals: '  $5 drafts till 6 ', notes: 'x'.repeat(600) }, '2026-10-02');
  const edited = applyVisit_(visited, { verdict: 'Meh', deals: '', notes: 'changed' }, '2026-11-11');
  const written = dataToRows_(new Map([['echo eatery', visited]]), [P('Echo Eatery', 'fremont')]);
  const backAgain = rowsToData_(DATA_HEADERS, written.rows).get('echo eatery');
  checks.push(
    ['tab: old layout read by header name', recOld.query === 'Echo Eatery fremont' && recOld.at === '2026-09-30' && recOld.locs.length === 1],
    ['tab: typed status normalised, blank rows skipped', recOld.status === 'ok' && fromOld.size === 1],
    ['tab: old layout has no visit', recOld.verdict === '' && visitOf_(recOld) === null],
    ['visit: saved with today\'s date, text trimmed and capped', visited.visited === '2026-10-02' && visited.dealsSeen === '$5 drafts till 6' && visited.visitNotes.length === 500],
    ['visit: editing keeps the first date', edited.visited === '2026-10-02' && edited.verdict === 'Meh' && edited.visitNotes === 'changed'],
    ['visit: no verdict clears it', applyVisit_(visited, { verdict: '' }, 'x').verdict === '' && applyVisit_(visited, { verdict: 'Amazing' }, 'x').visited === ''],
    ['visit: other fields untouched', visited.status === 'ok' && visited.locs.length === 1 && visited.query === recOld.query],
    ['visit: what the app receives', JSON.stringify(visitOf_(edited)) === '{"date":"2026-10-02","verdict":"Meh","deals":"","notes":"changed"}'],
    ['visit: a Sheets date object is sent as text', visitOf_({ verdict: 'Good', visited: new Date('2026-10-02T12:00:00Z') }).date === '2026-09-30'],
    ['tab: new layout has every header, in order', written.rows[0].length === DATA_HEADERS.length && written.rows[0][DATA_HEADERS.indexOf('Verdict')] === 'Loved'],
    ['tab: write then read gives the same record', backAgain.verdict === 'Loved' && backAgain.visited === '2026-10-02' && backAgain.status === 'ok' && backAgain.query === recOld.query && JSON.stringify(backAgain.locs) === JSON.stringify(recOld.locs)],
    ['visit: survives a fresh Google lookup', carryVisit_({ status: 'ok', locs: [] }, visited).verdict === 'Loved'],
    ['visit: a rate-limited lookup is left alone', !('verdict' in carryVisit_({ status: 'retry' }, visited))],
    ['visit: app gets it with the place', withAppData_([P('Echo Eatery')], new Map([['echo eatery', visited]]))[0].visit.verdict === 'Loved'],
  );

  // ----- Add a place from the phone -----
  const addedRows = [
    ['Kilo Kitchen', 'https://kilo.example/menu', 'ramen', 'fremont', 'HH 4-6', '2026-10-02'],
    ['  ', '', '', '', '', ''],
    ['Alpha Diner', '', 'already in the main tab', '', '', '2026-10-02'],
    ['kilo  kitchen!', '', 'typed twice', '', '', '2026-10-02'],
    ['Lima Lounge', 'not a link', '', '', '', '2026-10-02'],
  ];
  const addedPlaces = parseAdded_(addedRows, new Set(['alpha diner']));
  const sent = { id: 'abc', name: 'Kilo Kitchen', addr: '1 St', lat: '47.61', lng: -122.33, cuisine: 'Ramen', status: 'OPERATIONAL',
    maps: 'https://maps.example/x', utc: -420, hours: [[1, 1100, 1, 2200], ['x'], [1, 2, 3, 4, 5]], extra: 'ignored' };
  checks.push(
    ['add: rows become "To Try" places marked added', addedPlaces.length === 2 && addedPlaces[0].section === 'try' && addedPlaces[0].added === true],
    ['add: fields land in the right places', addedPlaces[0].hood === 'fremont' && addedPlaces[0].deals === 'HH 4-6' && addedPlaces[0].menu === 'https://kilo.example/menu'],
    ['add: main tab wins over a duplicate', !addedPlaces.some(p => p.key === 'alpha diner')],
    ['add: same place typed twice is shown once', addedPlaces.filter(p => p.key === 'kilo kitchen').length === 1],
    ['add: blank rows skipped, non-link menu dropped', addedPlaces[1].name === 'Lima Lounge' && addedPlaces[1].menu === ''],
    ['add: row label says which tab', addedPlaces[0].row === 'added 2' && addedPlaces[1].row === 'added 6'],
    ['add: picked match is reduced to known fields', JSON.stringify(Object.keys(cleanLoc_(sent))) === '["id","name","addr","lat","lng","cuisine","status","maps","utc","hours"]'],
    ['add: numbers are numbers, bad hours dropped', cleanLoc_(sent).lat === 47.61 && JSON.stringify(cleanLoc_(sent).hours) === '[[1,1100,1,2200]]'],
    ['add: nonsense location rejected', cleanLoc_({ lat: 'x', lng: 1 }) === null && cleanLoc_({ lat: 95, lng: 1 }) === null && cleanLoc_(null) === null],
    ['add: non-https map link dropped', cleanLoc_({ lat: 1, lng: 1, maps: 'javascript:alert(1)' }).maps === ''],
    ['add: formula-looking text is stored as text', safeCell_('=IMPORTRANGE("x")') === "'=IMPORTRANGE(\"x\")" && safeCell_('+1 pasta') === "'+1 pasta" && safeCell_('HH 4-6') === 'HH 4-6'],
  );

  // ----- Editing notes in the app -----
  const sheetPlace = { ...P('Echo Eatery', 'fremont'), desc: 'noodles', deals: 'HH 4-6' };
  const e1 = applyEdit_({ key: 'echo eatery', locs: [loc1] }, sheetPlace, { desc: 'noodles', deals: ' HH daily 3-6 ' });
  const shownEdited = withAppData_([{ ...sheetPlace }], new Map([['echo eatery', e1]]))[0];
  const sheetChanged = withAppData_([{ ...sheetPlace, deals: 'HH m-f 5-7' }], new Map([['echo eatery', e1]]))[0];
  const undone = applyEdit_(e1, sheetPlace, { desc: 'noodles', deals: 'HH 4-6' });
  const roundTrip = rowsToData_(DATA_HEADERS, dataToRows_(new Map([['echo eatery', e1]]), [sheetPlace]).rows).get('echo eatery');
  checks.push(
    ['edit: only changed fields are stored, trimmed', JSON.stringify(e1.edits) === '{"deals":{"was":"HH 4-6","now":"HH daily 3-6"}}'],
    ['edit: app shows the edited text, marked', shownEdited.deals === 'HH daily 3-6' && shownEdited.desc === 'noodles' && shownEdited.edited.deals.sheet === 'HH 4-6'],
    ['edit: Sheet changed later -> Sheet wins', sheetChanged.deals === 'HH m-f 5-7' && sheetChanged.edited === null],
    ['edit: setting it back removes the edit', JSON.stringify(undone.edits) === '{}'],
    ['edit: clearing a field is an edit too', applyEdit_({}, sheetPlace, { deals: '' }).edits.deals.now === ''],
    ['edit: stored in the tab and read back', roundTrip.edits.deals.now === 'HH daily 3-6'],
    ['edit: survives a fresh Google lookup', carryVisit_({ status: 'ok', locs: [] }, e1).edits.deals.now === 'HH daily 3-6'],
  );

  // ----- Keeping what was typed in the app safe in the "app data" tab -----
  const col = (name) => DATA_HEADERS.indexOf(name);
  const gone = { ...visited, key: 'old name', name: 'Old Name' };
  const plain = { key: 'no notes', name: 'No Notes', status: 'ok', query: 'No Notes', at: '2026-09-30', locs: [loc1] };
  const keptRows = dataToRows_(new Map([['old name', gone], ['no notes', plain]]), []).rows;
  const risky = applyVisit_({ key: 'echo eatery', status: 'ok', query: '+39 Pizzeria', at: '2026-09-30', locs: [] },
    { verdict: 'Good', deals: '=HYPERLINK("x")', notes: '-2 for slow service' }, '2026-10-02');
  const riskyRow = dataToRows_(new Map([['echo eatery', risky]]), [P('Echo Eatery')]).rows[0];
  const riskyBack = rowsToData_(DATA_HEADERS, [riskyRow]).get('echo eatery');
  // What an older tab hands back after Sheets "helpfully" converted the cells.
  const converted = { key: 1984, Verdict: 'Good', Visited: new Date('2026-10-02T12:00:00Z'), 'Deals seen': new Date(2026, 4, 6), 'Visit notes': 7, 'data (JSON)': '[]' };
  const fromSheets = rowsToData_(DATA_HEADERS, [DATA_HEADERS.map(h => (h in converted ? converted[h] : ''))]).get('1984');
  checks.push(
    ['safety: a visit survives its place leaving the list', keptRows.length === 1 && keptRows[0][col('Verdict')] === 'Loved' && keptRows[0][col('Sheet row')] === 'not in the list'],
    ['safety: …and is picked up again if the place returns', rowsToData_(DATA_HEADERS, keptRows).get('old name').verdict === 'Loved'],
    ['safety: a listed place is written once, in list order', dataToRows_(new Map([['echo eatery', visited]]), [P('Echo Eatery'), P('Echo Eatery')]).rows.length === 1],
    ['safety: formula-looking notes are stored as text', riskyRow[col('Deals seen')] === "'=HYPERLINK(\"x\")" && riskyRow[col('Visit notes')] === "'-2 for slow service" && riskyRow[col('Searched for')] === "'+39 Pizzeria"],
    ['safety: …and read back exactly as typed', riskyBack.dealsSeen === '=HYPERLINK("x")' && riskyBack.visitNotes === '-2 for slow service' && riskyBack.query === '+39 Pizzeria'],
    ['safety: cells Sheets converted come back as text', Boolean(fromSheets) && fromSheets.dealsSeen === '5-6' && fromSheets.visitNotes === '7' && fromSheets.visited === '2026-09-30'],
  );

  // ----- Health notes -----
  const today = new Date('2026-10-02T12:00:00Z');
  const ago = (days) => today.getTime() - days * 86400000;
  const fine = [{ section: 'try' }, { section: 'recommend' }];
  const H = (props, list = fine) => healthFrom_(props, list, today);
  checks.push(
    ['health: nothing to report when all is well', H({}).length === 0 && H({ 'usage:2026-10:textSearch': '700', 'health:nightly': JSON.stringify({ at: ago(0.5), ok: true }) }).length === 0],
    ['health: empty list is flagged', H({}, []).length === 1 && /no places/.test(H({}, [])[0])],
    ['health: missing "To Try" heading is flagged', /To Try/.test(H({}, [{ section: 'recommend' }, { section: 'try', added: true }])[0])],
    ['health: allowance at 90% of the cap', /Place lookups are at 92%/.test(H({ 'usage:2026-10:textSearch': '830' })[0])],
    ['health: cap reached', /Transit times have hit/.test(H({ 'usage:2026-10:matrixTransit': '4500' })[0])],
    ['health: last month\'s usage is ignored', H({ 'usage:2026-09:textSearch': '900' }).length === 0],
    ['health: Google refusal within 3 days', /refused a travel time request on Oct 1 \(403: Billing off\)/.test(H({ 'health:apiError': JSON.stringify({ at: ago(1), service: 'travel time', code: 403, msg: 'Billing off' }) })[0])],
    ['health: old refusal is dropped', H({ 'health:apiError': JSON.stringify({ at: ago(5), service: 'travel time', code: 403, msg: '' }) }).length === 0],
    ['health: overnight update failed', /overnight update failed/.test(H({ 'health:nightly': JSON.stringify({ at: ago(0.2), ok: false, msg: 'Error: x' }) })[0])],
    ['health: overnight update stopped running', /hasn't run since/.test(H({ 'health:nightly': JSON.stringify({ at: ago(5), ok: true }) })[0])],
    ['health: unreadable stored note is ignored', H({ 'health:nightly': '{broken' }).length === 0],
  );

  // ----- Deals reader (deals.js), with made-up wording -----
  await new Promise((ok, fail) => { const s = document.createElement('script'); s.src = '../deals.js'; s.onload = ok; s.onerror = fail; document.head.append(s); });
  const D = (text) => Deals.parseDeals(text).windows.map(Deals.describeWindow).join('; ');
  const at = (text, iso, closesIn = null) => Deals.dealAt(Deals.parseDeals(text).windows, new Date(iso), closesIn);
  // 2026-10-02 is a Friday; 2026-10-03 Saturday; 2026-10-04 Sunday.
  checks.push(
    ['deals: days + PM times', D('hh tu-th 3-4:45') === 'Tue–Thu 3 PM–4:45 PM'],
    ['deals: no days = daily, two windows', D('specials 2-3, 7-8') === 'Daily 2 PM–3 PM; Daily 7 PM–8 PM'],
    ['deals: times-only clause inherits days', D('hh sat-sun 1-2, 6-7') === 'Sat–Sun 1 PM–2 PM; Sat–Sun 6 PM–7 PM'],
    ['deals: days, then times in next clause', D('wed-fri, 5-6 (bar only)') === 'Wed–Fri 5 PM–6 PM'],
    ['deals: week wrap (fri-mon)', D('hh fri-mon 2-3') === 'Fri–Mon 2 PM–3 PM'],
    ['deals: run-together days (mwf)', D('hh mwf 4-5') === 'Mon, Wed, Fri 4 PM–5 PM'],
    ['deals: noon start', D('hh 12-3') === 'Daily 12 PM–3 PM'],
    ['deals: late night to midnight', D('late hh 11-12') === 'Daily 11 PM–midnight'],
    ['deals: "-close"', D('daily 10-close') === 'Daily 10 PM–close'],
    ['deals: "after 9pm"', D('$3 slices after 9pm') === 'Daily 9 PM–close'],
    ['deals: "until 5"', D('happy hour until 5') === 'Daily until 5 PM'],
    ['deals: day-only special', D('$1 tacos tuesdays') === 'Tue (special, all day)'],
    ['deals: prices are not times', D('$2 beers, $8 wine') === ''],
    ['deals: "all day" on a day', D('hh all day sunday') === 'Sun all day'],
    ['deals: Sheets date turned back into 4-7', D('2025-04-07 00:00:00') === 'Daily 4 PM–7 PM' && D('4/7/2025') === 'Daily 4 PM–7 PM'],
    ['deals: "happy hour" without times is vague', Deals.parseDeals('happy hour!').vagueHH && !Deals.parseDeals('happy hour!').understood],
    ['deal on at arrival', at('hh daily 4-6', '2026-10-02T17:00').status === 'now'],
    ['deal needs 10+ min left', at('hh daily 4-6', '2026-10-02T17:55') === null],
    ['deal starting within 30 min = soon', at('hh daily 4-6', '2026-10-02T15:35').status === 'soon'],
    ['deal starting in 31+ min = nothing', at('hh daily 4-6', '2026-10-02T15:29') === null],
    ['wrong day = nothing', at('hh mon-thu 4-6', '2026-10-02T17:00') === null],
    ['"-close" uses closing time', at('hh 10-close', '2026-10-02T22:30', 30).endsIn === 30],
    ['Saturday-night window still on after midnight', at('hh sat 10-2', '2026-10-04T00:30').status === 'now'],
    ['special counts all day on its day', at('$1 tacos fridays', '2026-10-02T12:00').kind === 'special'],
    ['happy hour beats special', at('$1 tacos fridays; hh 4-6', '2026-10-02T17:00').kind === 'hh'],
    ['"-close" from last night is not on this afternoon', at('daily 5-6, 9-close', '2026-10-02T15:00', 420) === null],
    ['"after 9pm" is not on at noon', at('$3 slices after 9pm', '2026-10-02T12:00', 600) === null],
    ['"-close" is still on after midnight the same night', at('hh fri 10-close', '2026-10-03T00:30', 60).endsIn === 60],
    ['"-close" starting soon', at('daily 9-close', '2026-10-02T20:40', 200).status === 'soon'],
    ['deals: "p.m." is not Monday', D('HH 4-6 p.m.') === 'Daily 4 PM–6 PM'],
    ['deals: "w/" is not Wednesday', D('$2 off w/ food') === ''],
    ['deals: the word "we" is not Wednesday', D('we liked the fries 4-6') === 'Daily 4 PM–6 PM' && D('hh we-fr 4-6') === 'Wed–Fri 4 PM–6 PM'],
    ['deals: "mmm" is not Monday', D('mmm good') === ''],
    ['deals: "4p-6p", "4 to 6", long dash', D('hh 4p-6p') === 'Daily 4 PM–6 PM' && D('hh 4 to 6') === 'Daily 4 PM–6 PM' && D('hh 3—6') === 'Daily 3 PM–6 PM'],
  );

  const ul = document.getElementById('checks');
  for (const [label, ok] of checks) {
    const li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    li.textContent = (ok ? 'PASS  ' : 'FAIL  ') + label;
    ul.appendChild(li);
  }
  window.testResult = { failed: checks.filter(c => !c[1]).map(c => c[0]) };

  // Real-tab migration check (local file, never committed): every row of the existing
  // "app data" tab must survive being read in the old layout and written in the new one.
  const tabRes = await fetch('appdata_rows.json');
  if (tabRes.ok) {
    const [header, ...rows] = await tabRes.json();
    const before = rowsToData_(header, rows);
    const fakePlaces = [...before.values()].map(r => ({ key: r.key, name: r.name, row: r.row }));
    const after = rowsToData_(DATA_HEADERS, dataToRows_(before, fakePlaces).rows);
    const same = [...before.values()].every(r => {
      const a = after.get(r.key);
      return a && a.status === r.status && a.query === r.query && String(a.at) === String(r.at) && JSON.stringify(a.locs) === JSON.stringify(r.locs);
    });
    const li = document.createElement('li');
    li.className = same && after.size === before.size ? 'pass' : 'fail';
    li.textContent = `${li.className === 'pass' ? 'PASS' : 'FAIL'}  real tab: ${before.size} rows survive the layout change unchanged`;
    document.getElementById('checks').appendChild(li);
    window.testResult.migration = { rows: before.size, same, sizeAfter: after.size };
    if (li.className === 'fail') window.testResult.failed.push('real tab migration');
  }

  const res = await fetch('fixture.json');
  if (!res.ok) return;
  const real = parseSheet(await res.json());
  const count = (f) => real.filter(f).length;
  const tags = {};
  real.forEach(p => p.tags.forEach(t => tags[t] = (tags[t] || 0) + 1));
  const summary = {
    total: real.length,
    recommend: count(p => p.section === 'recommend'),
    try: count(p => p.section === 'try'),
    favorites: count(p => p.fav),
    withDeals: count(p => p.deals),
    withMenuLink: count(p => p.menu),
    noNeighborhood: count(p => !p.hood),
    struck: count(p => p.struck),
    tags,
  };
  document.getElementById('summary').textContent = JSON.stringify(summary, null, 2);
  window.testResult.summary = summary;
})().catch(err => {
  document.body.insertAdjacentHTML('beforeend', `<p class="fail">${err}</p>`);
  window.testResult = { error: String(err) };
});
</script>
</body>
</html>
